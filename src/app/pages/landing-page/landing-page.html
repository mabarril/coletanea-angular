<div class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-900 relative overflow-hidden">

    <!-- Background Decor -->
    <div
        class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none">
    </div>
    <div
        class="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none">
    </div>

    <!-- Brand Header -->
    <div class="text-center mb-12 relative z-10 animate-in fade-in zoom-in duration-700 flex flex-col items-center">

        <!-- Logo Image -->
        <div class="mb-8 relative group">
            <div
                class="absolute -inset-4 bg-gradient-to-r from-indigo-500/20 to-purple-500/20 rounded-full opacity-0 group-hover:opacity-100 blur-xl transition duration-700">
            </div>
            <img src="../../../../public/assets/logo_colabbs.png" alt="co.labbs logo"
                class="relative h-24 md:h-32 w-auto object-contain drop-shadow-2xl transition-transform hover:scale-105 duration-500" />
        </div>

        <div class="flex flex-col items-center leading-none">
            <span class="text-5xl md:text-7xl font-black tracking-tighter text-white">
                co.<span class="text-indigo-500">letânea</span>
            </span>
            <span
                class="text-sm md:text-base text-slate-400 font-mono tracking-[0.3em] mt-4 border-t border-slate-700 pt-4 w-full max-w-[200px]">
                co.labbs
            </span>
        </div>

        <p class="text-slate-400 max-w-md mx-auto text-lg mt-6 font-light">
            A caixa de ferramentas oficial para dinâmicas e sorteios.
        </p>
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full max-w-[90rem] relative z-10">

        <!-- Wheel Card -->
        <button routerLink="/wheel"
            class="group relative bg-slate-800/50 hover:bg-slate-800 border border-slate-700 hover:border-indigo-500/50 rounded-3xl p-6 text-left transition-all duration-300 hover:shadow-2xl hover:shadow-indigo-500/10 hover:-translate-y-1 flex flex-col h-64 justify-between overflow-hidden">
            <div
                class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity transform group-hover:scale-110 duration-500">
                <lucide-angular [img]="LayoutGrid" class="w-[100px] h-[100px]"></lucide-angular>
            </div>

            <div
                class="bg-indigo-500/20 w-12 h-12 rounded-xl flex items-center justify-center mb-4 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                <lucide-angular [img]="Sparkles" class="w-6 h-6"></lucide-angular>
            </div>

            <div>
                <h2 class="text-xl font-bold text-white mb-2">Roleta</h2>
                <p class="text-slate-400 text-xs group-hover:text-slate-300">
                    Gire a roda para selecionar brindes ou participantes.
                </p>
            </div>

            <div
                class="flex items-center text-indigo-400 font-semibold mt-4 group-hover:translate-x-2 transition-transform text-sm">
                Abrir <lucide-angular [img]="ArrowRight" class="ml-2 w-4 h-4"></lucide-angular>
            </div>
        </button>

        <!-- Raffle Card -->
        <button routerLink="/raffle"
            class="group relative bg-slate-800/50 hover:bg-slate-800 border border-slate-700 hover:border-emerald-500/50 rounded-3xl p-6 text-left transition-all duration-300 hover:shadow-2xl hover:shadow-emerald-500/10 hover:-translate-y-1 flex flex-col h-64 justify-between overflow-hidden">
            <div
                class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity transform group-hover:scale-110 duration-500">
                <lucide-angular [img]="List" class="w-[100px] h-[100px]"></lucide-angular>
            </div>

            <div
                class="bg-emerald-500/20 w-12 h-12 rounded-xl flex items-center justify-center mb-4 text-emerald-400 group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                <lucide-angular [img]="Trophy" class="w-6 h-6"></lucide-angular>
            </div>

            <div>
                <h2 class="text-xl font-bold text-white mb-2">Sorteio</h2>
                <p class="text-slate-400 text-xs group-hover:text-slate-300">
                    Importe listas e realize sorteios rápidos.
                </p>
            </div>

            <div
                class="flex items-center text-emerald-400 font-semibold mt-4 group-hover:translate-x-2 transition-transform text-sm">
                Abrir <lucide-angular [img]="ArrowRight" class="ml-2 w-4 h-4"></lucide-angular>
            </div>
        </button>

        <!-- Quiz Card -->
        <button routerLink="/quiz"
            class="group relative bg-slate-800/50 hover:bg-slate-800 border border-slate-700 hover:border-purple-500/50 rounded-3xl p-6 text-left transition-all duration-300 hover:shadow-2xl hover:shadow-purple-500/10 hover:-translate-y-1 flex flex-col h-64 justify-between overflow-hidden">
            <div
                class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity transform group-hover:scale-110 duration-500">
                <lucide-angular [img]="Gamepad2" class="w-[100px] h-[100px]"></lucide-angular>
            </div>

            <div
                class="bg-purple-500/20 w-12 h-12 rounded-xl flex items-center justify-center mb-4 text-purple-400 group-hover:bg-purple-500 group-hover:text-white transition-colors">
                <lucide-angular [img]="Gamepad2" class="w-6 h-6"></lucide-angular>
            </div>

            <div>
                <h2 class="text-xl font-bold text-white mb-2">Quiz Show</h2>
                <p class="text-slate-400 text-xs group-hover:text-slate-300">
                    Game de perguntas estilo TV/Kahoot.
                </p>
            </div>

            <div
                class="flex items-center text-purple-400 font-semibold mt-4 group-hover:translate-x-2 transition-transform text-sm">
                Abrir <lucide-angular [img]="ArrowRight" class="ml-2 w-4 h-4"></lucide-angular>
            </div>
        </button>

        <!-- Timer Card -->
        <button routerLink="/timer"
            class="group relative bg-slate-800/50 hover:bg-slate-800 border border-slate-700 hover:border-cyan-500/50 rounded-3xl p-6 text-left transition-all duration-300 hover:shadow-2xl hover:shadow-cyan-500/10 hover:-translate-y-1 flex flex-col h-64 justify-between overflow-hidden">
            <div
                class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity transform group-hover:scale-110 duration-500">
                <lucide-angular [img]="Timer" class="w-[100px] h-[100px]"></lucide-angular>
            </div>

            <div
                class="bg-cyan-500/20 w-12 h-12 rounded-xl flex items-center justify-center mb-4 text-cyan-400 group-hover:bg-cyan-500 group-hover:text-white transition-colors">
                <lucide-angular [img]="Timer" class="w-6 h-6"></lucide-angular>
            </div>

            <div>
                <h2 class="text-xl font-bold text-white mb-2">Cronômetro</h2>
                <p class="text-slate-400 text-xs group-hover:text-slate-300">
                    Contagem regressiva com alertas visuais.
                </p>
            </div>

            <div
                class="flex items-center text-cyan-400 font-semibold mt-4 group-hover:translate-x-2 transition-transform text-sm">
                Abrir <lucide-angular [img]="ArrowRight" class="ml-2 w-4 h-4"></lucide-angular>
            </div>
        </button>

        <!-- Team Generator Card -->
        <button routerLink="/teams"
            class="group relative bg-slate-800/50 hover:bg-slate-800 border border-slate-700 hover:border-violet-500/50 rounded-3xl p-6 text-left transition-all duration-300 hover:shadow-2xl hover:shadow-violet-500/10 hover:-translate-y-1 flex flex-col h-64 justify-between overflow-hidden">
            <div
                class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity transform group-hover:scale-110 duration-500">
                <lucide-angular [img]="Users" class="w-[100px] h-[100px]"></lucide-angular>
            </div>

            <div
                class="bg-violet-500/20 w-12 h-12 rounded-xl flex items-center justify-center mb-4 text-violet-400 group-hover:bg-violet-500 group-hover:text-white transition-colors">
                <lucide-angular [img]="Users" class="w-6 h-6"></lucide-angular>
            </div>

            <div>
                <h2 class="text-xl font-bold text-white mb-2">Times</h2>
                <p class="text-slate-400 text-xs group-hover:text-slate-300">
                    Divida grupos aleatoriamente em equipes.
                </p>
            </div>

            <div
                class="flex items-center text-violet-400 font-semibold mt-4 group-hover:translate-x-2 transition-transform text-sm">
                Abrir <lucide-angular [img]="ArrowRight" class="ml-2 w-4 h-4"></lucide-angular>
            </div>
        </button>

        <!-- QRCode Card -->
        <button routerLink="/qrcode"
            class="group relative bg-slate-800/50 hover:bg-slate-800 border border-slate-700 hover:border-pink-500/50 rounded-3xl p-6 text-left transition-all duration-300 hover:shadow-2xl hover:shadow-pink-500/10 hover:-translate-y-1 flex flex-col h-64 justify-between overflow-hidden">
            <div
                class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity transform group-hover:scale-110 duration-500">
                <lucide-angular [img]="QrCode" class="w-[100px] h-[100px]"></lucide-angular>
            </div>

            <div
                class="bg-pink-500/20 w-12 h-12 rounded-xl flex items-center justify-center mb-4 text-pink-400 group-hover:bg-pink-500 group-hover:text-white transition-colors">
                <lucide-angular [img]="QrCode" class="w-6 h-6"></lucide-angular>
            </div>

            <div>
                <h2 class="text-xl font-bold text-white mb-2">QR Code</h2>
                <p class="text-slate-400 text-xs group-hover:text-slate-300">
                    Gerador rápido de QR Codes para links.
                </p>
            </div>

            <div
                class="flex items-center text-pink-400 font-semibold mt-4 group-hover:translate-x-2 transition-transform text-sm">
                Abrir <lucide-angular [img]="ArrowRight" class="ml-2 w-4 h-4"></lucide-angular>
            </div>
        </button>

        <!-- Shortener Card -->
        <!-- <button routerLink="/shortener"
            class="group relative bg-slate-800/50 hover:bg-slate-800 border border-slate-700 hover:border-orange-500/50 rounded-3xl p-6 text-left transition-all duration-300 hover:shadow-2xl hover:shadow-orange-500/10 hover:-translate-y-1 flex flex-col h-64 justify-between overflow-hidden">
            <div
                class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity transform group-hover:scale-110 duration-500">
                <lucide-angular [img]="Scissors" class="w-[100px] h-[100px]"></lucide-angular>
            </div>

            <div
                class="bg-orange-500/20 w-12 h-12 rounded-xl flex items-center justify-center mb-4 text-orange-400 group-hover:bg-orange-500 group-hover:text-white transition-colors">

            </div>

            class="group relative bg-slate-800/50 hover:bg-slate-800 border border-slate-700 hover:border-blue-500/50 rounded-3xl p-6 text-left transition-all duration-300 hover:shadow-2xl hover:shadow-blue-500/10 hover:-translate-y-1 flex flex-col h-64 justify-between overflow-hidden">

                </p>
            </div>

            </div>
        </button> -->

    </div>

    <footer class="absolute bottom-6 text-slate-600 text-sm font-medium">
        © {{ year }} co.labbs
    </footer>
</div>
