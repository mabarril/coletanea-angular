<div class="colendario-container">
    <div class="header">
        <h1 class="title">co.<span class="title-accent">lendário</span></h1>
        <p class="subtitle">Próximos eventos agendados • Atualizado em tempo real</p>
    </div>

    <div class="carousel-wrapper">
        <div class="rotation-progress-container">
            <div class="rotation-progress-bar" [style.width.%]="rotationProgress()"></div>
        </div>

        <div class="carousel-container">
            <div class="carousel-track" [style.transform]="'translateX(-' + (currentIndex() * 100) + '%)'">
                <!-- Page Wrapper -->
                <div class="carousel-item" *ngFor="let page of eventPages(); let pIndex = index">
                    <div class="table-container">
                        <table class="video-wall-table">
                            <thead>
                                <tr>
                                    <th class="col-date">Data</th>
                                    <th class="col-time">Horário</th>
                                    <th class="col-event">Evento</th>
                                    <th class="col-cap">
                                        <div class="header-icon-center">
                                            <lucide-angular [img]="Users" [size]="24"></lucide-angular>
                                        </div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let event of page" class="event-row animate-row"
                                    [class.is-live]="isLive(event)">
                                    <td class="col-date">
                                        <span class="cell-text">{{ formatDate(event.dataInicioEvento) }}</span>
                                    </td>
                                    <td class="col-time">
                                        <span class="cell-text">
                                            <ng-container *ngIf="!event.isDiaTodoEvento">
                                                {{ formatTime(event.dataInicioEvento) }} - {{
                                                formatTime(event.dataFimEvento) }}
                                            </ng-container>
                                            <ng-container *ngIf="event.isDiaTodoEvento">
                                                Dia Todo
                                            </ng-container>
                                        </span>
                                    </td>
                                    <td class="col-event">
                                        <div class="event-name-cell">
                                            <div class="event-title-wrapper">
                                                <span class="event-name-text">{{ event.nomeEvento }}</span>
                                                <span *ngIf="isLive(event)" class="badge-live">AO VIVO</span>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="col-cap">
                                        <span class="cell-text">{{ event.quantidadeMaximaParticipantesEvento }}</span>
                                    </td>
                                </tr>
                                <!-- Fill empty rows if less than 5 events to keep layout stable -->
                                <tr *ngFor="let i of [].constructor(5 - page.length)" class="empty-row">
                                    <td colspan="4">&nbsp;</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Indicators & Navigation -->
    <div class="footer-nav">
        <button class="nav-btn small" (click)="prev()" [disabled]="currentIndex() === 0">
            <lucide-angular [img]="ChevronLeft" [size]="16"></lucide-angular>
        </button>

        <div class="indicators">
            <div *ngFor="let page of eventPages(); let i = index" class="indicator"
                [class.active]="i === currentIndex()" (click)="currentIndex.set(i)"></div>
        </div>

        <button class="nav-btn small" (click)="next()"
            [disabled]="eventPages().length === 0 || currentIndex() === eventPages().length - 1">
            <lucide-angular [img]="ChevronRight" [size]="16"></lucide-angular>
        </button>
    </div>
</div>
