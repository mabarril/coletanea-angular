<div class="w-full max-w-4xl mx-auto p-4 animate-in fade-in duration-500">

    <header class="text-center mb-10">
        <div class="inline-flex items-center justify-center p-3 bg-orange-500/20 rounded-full mb-4">
            <lucide-angular [img]="Scissors" class="text-orange-400" [size]="32"></lucide-angular>
        </div>
        <h1 class="text-4xl md:text-5xl font-black text-white mb-2">
            Encurtador <span class="text-orange-400">URL</span>
        </h1>
        <p class="text-slate-400">Diminua links longos para compartilhar facilmente.</p>
    </header>

    <div class="max-w-2xl mx-auto space-y-8">

        <!-- Input Card -->
        <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl relative overflow-hidden">
            <div
                class="absolute top-0 right-0 w-32 h-32 bg-orange-500/10 rounded-full blur-3xl pointer-events-none -mr-10 -mt-10">
            </div>

            <form (submit)="handleShorten($event)" class="relative z-10">
                <label class="block text-slate-300 font-bold mb-4 flex items-center gap-2">
                    <lucide-angular [img]="LinkIcon" [size]="18"></lucide-angular> Cole seu link longo aqui
                </label>

                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" [ngModel]="url()" (ngModelChange)="url.set($event)" name="url"
                        placeholder="https://exemplo.com/pagina-muito-longa..."
                        class="flex-1 bg-slate-900 border border-slate-600 rounded-xl px-4 py-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all"
                        [disabled]="loading()" />
                    <button type="submit" [disabled]="loading() || !url().trim()"
                        class="bg-orange-500 hover:bg-orange-600 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 min-w-[140px]">
                        @if (loading()) {
                        <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                        } @else {
                        Encurtar <lucide-angular [img]="Scissors" [size]="18"></lucide-angular>
                        }
                    </button>
                </div>

                @if (error()) {
                <p class="mt-4 text-red-400 text-sm flex items-center gap-2 bg-red-400/10 px-4 py-2 rounded-lg">
                    <lucide-angular [img]="AlertCircle" [size]="16"></lucide-angular> {{ error() }}
                </p>
                }
            </form>
        </div>

        <!-- History / Results List -->
        @if (history().length > 0) {
        <div class="animate-in slide-in-from-bottom-4 duration-500">
            <h3 class="text-slate-400 font-bold uppercase text-sm tracking-widest mb-4 flex items-center gap-2">
                <lucide-angular [img]="History" [size]="16"></lucide-angular> Recentes
            </h3>

            <div class="space-y-3">
                @for (item of history(); track item.id) {
                <div
                    class="bg-slate-800/50 border border-slate-700/50 hover:border-orange-500/30 rounded-xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 transition-all">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xl font-bold text-orange-400">{{ item.short }}</span>
                            <span
                                class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded text-[10px] uppercase font-bold">TinyURL</span>
                        </div>
                        <p class="text-slate-500 text-xs truncate max-w-md" [title]="item.original">
                            {{ item.original }}
                        </p>
                    </div>

                    <div class="flex items-center gap-2 w-full md:w-auto">
                        <a [href]="item.short" target="_blank" rel="noopener noreferrer"
                            class="p-3 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300 transition-colors"
                            title="Abrir Link">
                            <lucide-angular [img]="ArrowRight" [size]="20"></lucide-angular>
                        </a>

                        <button (click)="copyToClipboard(item.short, item.id)"
                            class="flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-bold transition-all"
                            [ngClass]="copiedId() === item.id 
                      ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' 
                      : 'bg-orange-500 text-white hover:bg-orange-600 shadow-lg hover:scale-105'
                  ">
                            @if (copiedId() === item.id) {
                            Copiado <lucide-angular [img]="Check" [size]="18"></lucide-angular>
                            } @else {
                            Copiar <lucide-angular [img]="Copy" [size]="18"></lucide-angular>
                            }
                        </button>
                    </div>
                </div>
                }
            </div>
        </div>
        }

    </div>
</div>
