<div class="relative w-full max-w-[400px] aspect-square mx-auto">
    <!-- Pointer/Indicator -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-2 z-20 text-slate-800 drop-shadow-lg">
        <lucide-angular [img]="ChevronDown" [size]="48" fill="white" [strokeWidth]="2"></lucide-angular>
    </div>

    <!-- The Wheel SVG -->
    <div class="w-full h-full rounded-full shadow-2xl border-4 border-slate-700 overflow-hidden relative bg-slate-800 origin-center"
        [ngStyle]="transformStyle">
        <svg viewBox="0 0 200 200" class="w-full h-full">
            <g>
                @for (slice of slices(); track $index) {
                <g>
                    <path [attr.d]="slice.pathData" [attr.fill]="slice.color" stroke="#1e293b" strokeWidth="1"></path>
                    <text [attr.x]="slice.textX" [attr.y]="slice.textY" fill="white" fontSize="10" fontWeight="bold"
                        textAnchor="middle" dominantBaseline="middle"
                        [attr.transform]="'rotate(' + (slice.midAngle + 90) + ', ' + slice.textX + ', ' + slice.textY + ')'"
                        style="text-shadow: 0px 1px 2px rgba(0,0,0,0.5)">
                        {{ slice.truncatedLabel }}
                    </text>
                </g>
                }
            </g>
        </svg>
    </div>

    <!-- Center Spin Button -->
    <button (click)="spin.emit()" [disabled]="isSpinning() || !isValid()" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 
      w-20 h-20 rounded-full border-4 border-slate-200 shadow-xl
      flex items-center justify-center font-bold text-lg uppercase tracking-wider
      transition-all duration-300" [ngClass]="{
      'bg-slate-400 text-slate-600 cursor-not-allowed scale-95': isSpinning(),
      'bg-gradient-to-br from-indigo-500 to-purple-600 text-white hover:scale-110 hover:shadow-indigo-500/50': !isSpinning() && isValid(),
      'bg-slate-600 text-slate-400 cursor-not-allowed opacity-50': !isSpinning() && !isValid()
    }">
        @if (isSpinning()) {
        ...
        } @else {
        Girar
        }
    </button>
</div>
