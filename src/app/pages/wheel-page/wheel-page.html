<div class="flex flex-col items-center gap-8 w-full animate-in fade-in duration-500">
    <!-- Header -->
    <header class="text-center space-y-1">
        <h1 class="text-3xl md:text-4xl font-black tracking-tight text-white drop-shadow-md">
            Roleta da <span class="text-indigo-400">Sorte</span>
        </h1>
        <p class="text-slate-400 text-sm">Adicione itens, gire a roleta e descubra o vencedor!</p>
    </header>

    <!-- Main Layout -->
    <main
        class="w-full max-w-[1800px] grid grid-cols-1 lg:grid-cols-[1fr_450px] gap-8 items-start justify-items-center px-4 md:px-8">

        <!-- Left Column: Wheel -->
        <section class="w-full flex justify-center order-2 lg:order-1">
            <app-wheel class="w-full max-w-[600px]" [items]="activeItems()" [rotation]="rotation()"
                [isSpinning]="isSpinning()" [spinDuration]="spinDuration" (spin)="handleSpin()"></app-wheel>
        </section>

        <!-- Right Column: Controls -->
        <section class="w-full max-w-[450px] flex justify-center lg:justify-start order-1 lg:order-2 h-full">
            <app-wheel-controls [items]="items()" [activeCount]="activeItems().length" [isSpinning]="isSpinning()"
                (addItem)="addItem($event)" (removeItem)="removeItem($event)"
                (updateQuantity)="updateQuantity($event)"></app-wheel-controls>
        </section>

    </main>

    <app-winner-modal [winner]="winner()" (close)="closeModal()"></app-winner-modal>
</div>
